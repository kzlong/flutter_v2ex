name: Publish Android Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, e.g. v1.3.3'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then TAG="$INPUT_TAG"; fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Checkout exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          persist-credentials: false
      - name: Verify pubspec version matches tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION=$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+[0-9]+.*/\1/p' pubspec.yaml | head -n 1)
          test "v$VERSION" = "$TAG" || { echo "pubspec version v$VERSION != $TAG" >&2; exit 1; }
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Validate release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then echo "Missing secret: $key" >&2; exit 1; fi
          done
      - name: Restore Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/vvex.jks
          test -s android/app/vvex.jks
      - name: Build release APKs per ABI
        env:
          KEYSTORE: vvex.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi
      - name: Rename APKs
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p release-apks
          for abi in armeabi-v7a arm64-v8a x86_64; do
            source="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -s "$source" || { echo "Missing APK: $source" >&2; exit 1; }
            cp "$source" "release-apks/flutter-v2ex-$TAG-$abi.apk"
          done
          (cd release-apks && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite signed artifacts" >&2
            exit 1
          fi
          gh release create "$TAG" release-apks/* \
            --title "flutter_v2ex $TAG" \
            --generate-notes \
            --verify-tag
      - name: Remove signing keystore
        if: always()
        run: rm -f android/app/vvex.jks
